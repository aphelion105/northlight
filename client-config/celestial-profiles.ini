# Regional sun/moon appearance and lighting. Read on game startup.
# RGB values: 0..1, gains/strengths: 0..4. Decimal separator is a dot.
# Zone sections inherit [default]. Maps: Azeroth, Kalimdor, Expansion01, Northrend.
# light_mix: 0 retains authored light color, 1 uses the chosen hue at the
# authored luminance. light_strength then scales that light's energy.
# Disc RGB is display color; light RGB is a linear-light hue, independent of it.
# glow_strength (0..4, default 1) scales the sun/moon glow in the fog volume (shafts, aureole) independently of
# light_strength, which scales surface light only. glow (RGB) + glow_mix (0..1, default 0 = the light hue/mix)
# give the glow its own hue. Zones that lower light_strength set the same glow_strength to keep their glow.

[default]
sun_disc = 1.00, 0.96, 0.88
sun_disc_gain = 3.5
sun_light = 1.00, 1.00, 1.00
sun_light_mix = 0
sun_light_strength = 1
# Stronger daytime solar scattering in the existing air volume. These do not
# change surface illumination, the disc, distance fog or moon/night settings.
sun_fog_gain = 4.3
sun_fog_height_scale = 2.0
moon_disc = 0.94, 0.97, 1.00
moon_disc_gain = 1.1
moon_light = 1.00, 1.00, 1.00
moon_light_mix = 0
moon_light_strength = 1
# Moon shafts/scattering only; disc and surface illumination keep their gains.
moon_fog_gain = 2.5
# Horizon haze strength multiplier by day (sun_) and night (moon_), 0..4, on
# top of HorizonHaze in northlight-quality.ini. 0 = no haze in this zone, 1 = the
# global strength. Night blends smoothly between them. Surface light, discs,
# the near fog and the game's own distance fog are not affected.
sun_horizon_haze = 1
moon_horizon_haze = 1

